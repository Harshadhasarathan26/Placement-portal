{% extends "base.html" %}

{% block title %}Free Sign Up | Placement Prep AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-card">
        <h2 class="auth-title">Create Account</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Start your placement journey</p>
        
        <form action="{{ url_for('signup') }}" method="POST">
            <div class="form-group">
                <label for="username">Preferred Username</label>
                <input type="text" id="username" name="username" placeholder="john_doe" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
            </div>
            
            <button type="submit" class="btn-primary btn-block" style="margin-top: 1rem;">
                <i class="fas fa-user-plus"></i> Join PrepAI
            </button>
        </form>
        
        <div class="auth-links">
            <p style="color: var(--text-muted)">Already registered? <a href="{{ url_for('login') }}">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
